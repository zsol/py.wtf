<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Single Page Apps for GitHub Pages</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // Carry the original URL to Next's exported SPA shell. The document's
      // head script restores it before hydration and BrowserRouter mount.
      // Encode the envelope once so existing escapes, query strings, and
      // hash fragments survive unchanged. The redirect stays on this origin.
      var l = window.location;
      l.replace(
        "/_spa.html?__py_wtf_spa=" +
          encodeURIComponent(l.pathname + l.search + l.hash),
      );
    </script>
  </head>
  <body></body>
</html>
